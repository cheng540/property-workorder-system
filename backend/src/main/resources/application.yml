server:
  port: 8096

spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/property;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ''
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  web:
    resources:
      static-locations: classpath:/static/
  jackson:
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: property-repair-system-jwt-secret-key-2026
  expire-hours: 24
